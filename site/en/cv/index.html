<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>CV · M2 Solution</title>
    <meta name="description" content="CVs for Mathis Côté and Mathieu Laureti." />
    <link rel="canonical" href="https://m2solution.ca/en/cv/" />
    <link rel="alternate" hreflang="en" href="https://m2solution.ca/en/cv/" />
    <link rel="alternate" hreflang="fr" href="https://m2solution.ca/fr/cv/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css?v=cv5" />
  </head>
  <body class="cv-page">
    <header class="topbar is-on" data-topbar>
      <a class="topbar-logo" href="../../">M2 Solution</a>
      <nav class="lang" aria-label="Language">
        <a href="./" hreflang="en" lang="en" aria-current="page">EN</a>
        <span aria-hidden="true">·</span>
        <a href="../../fr/cv/" hreflang="fr" lang="fr">FR</a>
      </nav>
    </header>

    <main class="band">
      <p class="kicker">CV</p>
      <h1>Mathis Côté and Mathieu Laureti</h1>
      <p>Choose a profile to open the matching CV.</p>
      <div class="cv-switch" role="group" aria-label="Choose a CV">
        <button type="button" data-cv-person="mathis" aria-pressed="true">
          Mathis Côté
        </button>
        <button type="button" data-cv-person="mathieu" aria-pressed="false">
          Mathieu Laureti
        </button>
      </div>

      <article class="cv-panel" data-cv-panel="mathis">
        <h2>Mathis Côté</h2>
        <div class="cv-pages">
          <img
            class="cv-sheet"
            src="mathis-1.png"
            width="1224"
            height="1584"
            alt="CV of Mathis Côté, page 1"
          />
          <img
            class="cv-sheet"
            src="mathis-2.png"
            width="1224"
            height="1584"
            alt="CV of Mathis Côté, page 2"
          />
        </div>
        <a class="more" href="mathis.pdf">Download PDF</a>
      </article>

      <article class="cv-panel" data-cv-panel="mathieu" hidden>
        <h2>Mathieu Laureti</h2>
        <div class="cv-pages">
          <img
            class="cv-sheet"
            src="mathieu-1.png"
            width="1224"
            height="1584"
            alt="CV of Mathieu Laureti, page 1"
          />
          <img
            class="cv-sheet"
            src="mathieu-2.png"
            width="1224"
            height="1584"
            alt="CV of Mathieu Laureti, page 2"
          />
        </div>
        <a class="more" href="mathieu.pdf">Download PDF</a>
      </article>
    </main>

    <footer class="legal">
      <p>© 2026 M2 Solution · All rights reserved</p>
    </footer>
    <script src="../../site.js?v=cv5" defer></script>
  </body>
</html>
